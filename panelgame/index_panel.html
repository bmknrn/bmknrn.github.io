  <script>

      var t=60;
      //残り時間の変数
      
      var timer=0;
      //タイマー管理の変数
      
      var mode="停止中";
      //ゲームの動作状態
      
      var gameStart=false;
      //ゲーム開始時の判定
      
      var score=0;
      //スコア管理の変数
      
      var select=[];
      //クリックしたパネルを記録する変数
      
      var pair=[];
      //ペアの対応
      
      
      
      for(var i=0;i < 64; i += 2){
      
          pair[i]=i+1;
          pair[i+1]=i;
          
      }//パネルがそれぞれペアになる処理
      
      
      function start(){
      
        if (mode=="停止中"){
        
          if(t <= 0){
          
            t=60;
            //タイマーの時間指定
            
            score=0;
            document.getElementById("score").innerHTML="score:";
            //スコア追加の処理とデフォルトの数
            
            for(var i=0; i<64; i++){
            
                var element=document.getElementById("paneru"+i);
                
                element.style.visibility="visible";
                element.style.backgroundColor="";
                
            }//ゲームが終わった状態でスタートを押すとパネルとタイマーを初期状態に戻す処理
            
            
            select=[];
            
          }//選択状態リセット
          
          
          document.getElementById("timer").innerHTML=t;
          
          random();
          
          timer = setInterval(showTime, 1000);
          mode="動作中";
          
          gameStart=true;
          
        }//スタートを押すとタイマーとゲームが動き出す処理
        
        
      }//スタートに関する処理
      
      
      function showTime(){
      
        t--;
        document.getElementById("timer").innerHTML=t;
        
        if(t <= 0){
        
          clearInterval(timer);
          mode="停止中";
          
          gameStart=false;
          
          if(select.length == 1){
          
              document.getElementById("paneru"+select[0]).style.backgroundColor="";
              
          }//タイマーを減らして、0秒になったらゲームを停止する処理＋選択途中のパネルも戻す処理
          
          select=[];
          
        }//選択解除の処理
        
        
      }//スタートを押すと、タイマーが動いてパネルの色が変えられるようになる処理
      //ここまでスタートに関する処理
      
      
      function paneru(x){
      
        if(gameStart==false){
        
          return;
          
        }//スタートを押すまでパネルの色を変えられないようにする処理
        
        
        var element=document.getElementById("paneru" + x);
        
        if(element.style.visibility == "hidden"){
          
            return;
          
        }//消えたパネルをクリック不可にする処理
        
        
        if(select.includes(x)){
          
            return;
          
        }//選択しているパネルをもう一度クリック出来ないようにする処理
        
        
        element.style.backgroundColor="#FFB6C1";
        //パネルをクリックすると指定色に変更させる処理
        
        
        select.push(x);
        //ペア判定用のクリックした番号を記録する処理
        
        
        if(select.length == 2){
        
            var a=select[0];
            var b=select[1];
            
            if(pair[a] == b){
            
                document.getElementById("paneru"+a).style.visibility="hidden";
                document.getElementById("paneru"+b).style.visibility="hidden";
                
                score++;
                
                document.getElementById("score").innerHTML="";
                
                for(var i=0; i<score; i++){
                
                  document.getElementById("score").innerHTML+='<img src="うさぎ.PNG" width="11%">';
                
                }//スコアうさぎが増える処理
                
            }else{
            
            document.getElementById("paneru"+a).style.backgroundColor="";
            document.getElementById("paneru"+b).style.backgroundColor="";
            
            }//ペアかどうか判定し、合っていれば消して間違っていれば色を戻すための処理
            
            
            select=[];
            
          }//選択状態リセット処理
          
      
      }//パネルの色がクリックしたら変わる処理＋ペアが合ってれば消える、間違ってたら選択しなおせる処理
      //ここまでパネルに関する処理
      
      
      function random(){
          
          var all=document.querySelector(".all");
          var p=Array.from(document.querySelectorAll(".box"));
          
          for(var i=p.length - 1;i >0; i--){
          
              var j=Math.floor(Math.random()*(i+1));
              
              var temp=p[i];
              p[i]=p[j];
              p[j]=temp;
              
          }
          
          var clear=all.lastElementChild;
          
          for(var i=0; i< p.length; i++){
          
              all.appendChild(p[i]);
              
          }
          
          all.appendChild(clear);
          
      }
      
      //ここまでランダムに関する処理

  </script>
