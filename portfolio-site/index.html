<html>


	<head>

		<meta charset="UTF-8">
		<link rel="stylesheet" href="p-style.css">
		<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

		<title>ポートフォリオ</title>

	</head>

	<body>


		<div class="page">


			<div class="top">

				<img src="トップ画.png">

				<div style="position:relative;">

					<div style="position:absolute; top:-280px; right:-300px;">

						<img src="トップイラスト.PNG" width="220" height="220">

					</div>

				</div>

			</div>


			<div class="profile">

				<img src="プロフ.png">

			</div>

				<div class="skill">

					<div class="skill1">

								<img class="skill-img1" src="スキル1.png">

								<img class="skill-img2" src="スキル2.png">

								<img class="skill-img3" src="スキル3.png">

					</div>

				</div>
				<div style="clear:both;"></div>


			<div class="logo1">

				<img src="ロゴデザイン1.png">

			</div>
			<div style="clear:both;"></div>


			<div class="work">

				<div class="work1">

					<img src="本チラシ.png" class="zoom-img">

				</div>

				<div class="work2">

					<img src="オリゴ党.png" class="zoom-img">

				</div>

				<div class="work3">

					<img src="ロゴマーク1.png" class="zoom-img">

				</div>

			</div>
			<div style="clear:both;"></div>

			<div id="image-big">

				<img id="big-image" src="">

			</div>


			<div style="position:relative;">

				<div style="position:absolute; bottom:-300px; left:-20px;">

					<img src="WEB用イラスト1.PNG" width="220" height="220">

				</div>

				<div style="position:absolute; bottom:-300px; right:-20px;">

					<img src="WEB用イラスト2.PNG" width="240" height="240">

				</div>

			</div>


			<div class="logo2">

				<img src="ロゴデザイン2.png">

			</div>
			<div style="clear:both;"></div>


			<div class="illust">

				<img src="イラスト.png">

			</div>

		</div>


	<script>


		const images=document.querySelectorAll(".zoom-img");				/*拡大対象の画像を取得*/

		const modal=document.getElementById("image-big");					/*拡大表示用の背景と画像を取得*/
		const modalImage=document.getElementById("big-image");

		images.forEach(function(image){

			image.addEventListener("click", function(){

				modalImage.src=image.src;
				modalImage.alt=image.alt;

				modal.style.display="flex";

				requestAnimationFrame(function(){

					requestAnimationFrame(function(){

						modal.classList.add("show");

					});

				});															/*表示アニメを開始*/

			});

		});																	/*画像をクリックしたとき*/

		 modal.addEventListener("click",function(event){

			if(event.target === modal){

				modal.classList.remove("show");

					setTimeout(function(){

						modal.style.display="none";

					},400);

			}

		});


</script>


</body>


</html>
