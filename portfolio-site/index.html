<html>


	<head>

		<meta charset="UTF-8">
		<link rel="stylesheet" href="p-style.css">
		<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

		<title>中大路絵実のPortfolio</title>

	</head>

	<body>


		<div class="page">


			<div class="top">

				<img src="トップ画.png">

				<div style="position:relative;">

					<div style="position:absolute; top:-280px; right:-300px;">

						<img src="トップイラスト.PNG" width="220" height="220">

					</div>

				</div>

			</div>


			<div class="profile">

				<img src="プロフ.png">

			</div>

				<div class="skill">

					<div class="skill1">

								<img class="skill-img1" src="スキル1.png">

								<img class="skill-img2" src="スキル2.png">

								<img class="skill-img3" src="スキル3.png">

					</div>

				</div>
				<div style="clear:both;"></div>


			<div class="logo1">

				<img src="ロゴデザイン1.png">

			</div>
			<div style="clear:both;"></div>


			<div class="work">

				<div class="work1">

					<img src="本チラシ.png" class="zoom-img">

				</div>

				<div class="work2">

					<img src="オリゴ党.png" class="zoom-img">

				</div>

				<div class="work3">

					<div class="logo-slider">

						<img id="logo-slide" src="ロゴマーク1.png" class="zoom-img" alt="ロゴマーク">

					</div>

				</div>
				<div style="clear:both;"></div>

			<div id="image-big">

				<button class="slider-button prev" type="button">

					&#10094;

				</button>

				<img id="big-image" src="" alt="">

				<button class="slider-button next" type="button">

					&#10095;

				</button>

			</div>


			<div style="position:relative;">

				<div style="position:absolute; bottom:-300px; left:-20px;">

					<img src="WEB用イラスト1.PNG" width="220" height="220">

				</div>

				<div style="position:absolute; bottom:-300px; right:-20px;">

					<img src="WEB用イラスト2.PNG" width="240" height="240">

				</div>

			</div>


			<div class="logo2">

				<img src="ロゴデザイン2.png">

			</div>
			<div style="clear:both;"></div>


			<div class="illust">

				<img src="イラスト.png">

			</div>

		</div>


	<script>


		const images=document.querySelectorAll(".zoom-img");							/*拡大対象の画像を取得*/

		const modal=document.getElementById("image-big");
		const modalImage=document.getElementById("big-image");							/*拡大表示用の背景と画像を取得*/

		images.forEach(function(image){

			image.addEventListener("click", function(){

				modalImage.src=image.src;
				modalImage.alt=image.alt;

				modal.classList.toggle("logo-modal",image.id==="logo-slide");

				modal.style.display="flex";

				requestAnimationFrame(function(){

					requestAnimationFrame(function(){

						modal.classList.add("show");

					});

				});

			});

		});																				/*画像をクリックしたときのズーム処理*/

		modal.addEventListener("click",function(event){

			if(event.target===modal){

				modal.classList.remove("show");

				setTimeout(function(){

					modal.style.display="none";

				},400);

			}

		});																				/*背景をクリックしたら閉じる*/


		const logoImages=[

			"ロゴマーク1.png",
			"ロゴマーク2.png",
			"ロゴマーク3.png"

		];																				/*ロゴスライダーの画像一覧*/


		const logoSlide=document.getElementById("logo-slide");

		let currentIndex=0;

		function changeLogo(index){

			currentIndex=index;
			logoSlide.src=logoImages[currentIndex];

		}																				/*表示するロゴを変更*/


		const modalPrevButton=document.querySelector(".slider-button.prev");
		const modalNextButton=document.querySelector(".slider-button.next");			/*拡大画面の矢印を取得*/

		modalPrevButton.addEventListener("click",function(event){

			event.stopPropagation();

			currentIndex--;

			if(currentIndex < 0){

				currentIndex=logoImages.length -1 ;

			}

			changeLogo(currentIndex);
			modalImage.src=logoSlide.src;

		});																				/*拡大画面で前のロゴに切り替える*/

		modalNextButton.addEventListener("click",function(event){

			event.stopPropagation();

			currentIndex++;

			if(currentIndex >=logoImages.length){

				currentIndex=0;

			}

			changeLogo(currentIndex);
			modalImage.src = logoSlide.src;

		});																				/*拡大画面で次のロゴに切り替える*/


</script>


</body>


</html>
