<html>


	<head>

		<meta charset="UTF-8">
		<link rel="stylesheet" href="p-style.css">
		<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

		<title>中大路絵実のPortfolio</title>

	</head>

	<body>


		<div class="page">


			<div class="top">

				<img src="トップ画.png">

				<div style="position:relative;">

					<div style="position:absolute; top:-280px; right:-300px;">

						<img src="トップイラスト.PNG" width="220" height="220">

					</div>

				</div>

			</div>


			<div class="profile">

				<img src="プロフ.png">

			</div>

				<div class="skill">

					<div class="skill1">

								<img class="skill-img1" src="スキル1.png">

								<img class="skill-img2" src="スキル2.png">

								<img class="skill-img3" src="スキル3.png">

					</div>

				</div>
				<div style="clear:both;"></div>


			<div class="logo1">

				<img src="ロゴデザイン1.png">

			</div>
			<div style="clear:both;"></div>


			<div class="work">

				<div class="work1">

					<div class="flyer-slider">

						<img id="flyer-slide" src="本チラシ.png" class="zoom-img" alt="本チラシ">

					</div>

				</div>

				<div class="work2">

					<img src="オリゴ党.png" class="zoom-img">

				</div>

				<div class="work3">

					<div class="logo-slider">

						<img id="logo-slide" src="ロゴマーク1.png" class="zoom-img" alt="ロゴマーク">

					</div>

				</div>
				<div style="clear:both;"></div>

			</div>

			<div id="image-big">

				<button class="slider-button prev" type="button">

					&#10094;

				</button>

				<img id="big-image" src="" alt="">

				<button class="slider-button next" type="button">

					&#10095;

				</button>

			</div>


			<div style="position:relative;">

				<div style="position:absolute; bottom:-300px; left:-20px;">

					<img src="WEB用イラスト1.PNG" width="220" height="220">

				</div>

				<div style="position:absolute; bottom:-300px; right:-20px;">

					<img src="WEB用イラスト2.PNG" width="240" height="240">

				</div>

			</div>


			<div class="logo2">

				<img src="ロゴデザイン2.png">

			</div>
			<div style="clear:both;"></div>


			<div class="illust">

				<img src="イラスト.png">

			</div>

		</div>


	<script>


		const logoImages=[

			"ロゴマーク1.png",
			"ロゴマーク2.png",
			"ロゴマーク3.png"

		];																		/*ロゴ画像一覧*/

		const flyerImages = [

			"本チラシ.png",
			"酔族館_初報.png",
			"酔族館チラシ2.png",
			"酔族館チラシ3.png",
			"酔族館チラシ4.png",
			"酔族館チラシ5.png",

		];																		/*本チラシ画像一覧*/


		const galleries={

			logo:{

				images:logoImages,
				element:document.getElementById("logo-slide")

			},

			flyer:{

				images:flyerImages,
				element:document.getElementById("flyer-slide")

			}

		};																		/*画像一覧と表示用画像をまとめる*/

		/*拡大画面の取得*/
		const images=document.querySelectorAll(".zoom-img");
		const modal=document.getElementById("image-big");
		const modalImage=document.getElementById("big-image");

		/*拡大中の画像一覧と番号*/
		let currentGallery=null;
		let currentIndex=0;


		function changeGallery(index){

			if(currentGallery === null){

				return;

			}

			const gallery=galleries[currentGallery];

			currentIndex=index;

			gallery.element.src=gallery.images[currentIndex];

			modalImage.src=gallery.element.src;

		}																		/*画像を切り替える*/


		images.forEach(function(image){

			image.addEventListener("click",function(){

				if(image.id === "logo-slide"){

					currentGallery = "logo";

				}																/*ロゴか本チラシかを判定*/

				else if(image.id === "flyer-slide"){

					currentGallery="flyer";

				}else{

					currentGallery=null;

				}																/*画像をクリックしたときのズーム*/

			/*拡大画像を設定*/
			modalImage.src=image.src;
			modalImage.alt=image.alt;

			modal.classList.remove("logo-modal","flyer-modal");

			if(currentGallery === "logo"){

				modal.classList.add("logo-modal");

			}

			if(currentGallery === "flyer"){

				modal.classList.add("flyer-modal");

			}																	/*矢印の表示対象を切り替える*/

			if(currentGallery !== null){

				const gallery=galleries[currentGallery];

				currentIndex=gallery.images.indexOf(

					gallery.element.getAttribute("src")

				);

				if(currentIndex < 0){

					currentIndex=0;

				}

			}																	/*現在表示している画像の番号を取得*/

		modal.style.display="flex";

		requestAnimationFrame(function(){

			requestAnimationFrame(function(){

				modal.classList.add("show");

			});

		});

		});

		});																		/*拡大画面を表示*/

		modal.addEventListener("click",function(event){

			if(event.target === modal){

				modal.classList.remove("show");

				setTimeout(function(){

					modal.style.display="none";

				},400);

			}

		});																		/*背景をクリックしたら閉じる*/

		const modalPrevButton=document.querySelector(".slider-button.prev");

		modalPrevButton.addEventListener("click",function(event){

			event.stopPropagation();

			if(currentGallery === null){

				return;

			}

			currentIndex--;

			if(currentIndex < 0){

				currentIndex = galleries[currentGallery].images.length - 1;

			}

			changeGallery(currentIndex);

		});																		/*拡大画面の左矢印*/

		const modalNextButton=document.querySelector(".slider-button.next");

		modalNextButton.addEventListener("click",function(event){

			event.stopPropagation();

			if(currentGallery === null){

				return;

			}

			currentIndex++;

			if(currentIndex >= galleries[currentGallery].images.length){

				currentIndex=0;

			}																	/*拡大画面の右矢印*/

			changeGallery(currentIndex);

		});


</script>


</body>


</html>
